# --- PostgreSQL connection ---
spring.datasource.url=jdbc:postgresql://localhost:5433/hibernate_learning
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- Schema generation ---
# "update": adds/adjusts tables and columns to match the entities but never
# drops existing data, so rows inserted now stay put across app restarts.
spring.jpa.hibernate.ddl-auto=update

# --- Hibernate SQL logging: see the generated SQL and bound parameter values ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# --- Hibernate statistics: an authoritative count of every SQL statement
# Hibernate actually sent to the DB (not just eyeballing log lines) ---
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG
