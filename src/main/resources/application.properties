# --- PostgreSQL connection ---
spring.datasource.url=jdbc:postgresql://localhost:5433/hibernate_learning
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- Schema generation ---
# "create": drops and recreates the schema on every startup (clean slate each run,
# so the experiment is easy to re-run), but does NOT drop on shutdown, so the
# inserted row is still there to inspect in PostgreSQL after the app exits.
spring.jpa.hibernate.ddl-auto=create

# --- Hibernate SQL logging: see the generated SQL and bound parameter values ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
